
<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Nutritional Food Recommendation System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/app.css') }}">
</head>

<body class="auth-body">

    <!-- Top Right Navigation -->
    <div class="auth-top-nav">
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/register" class="active">Register</a>
    </div>

    <!-- Register Card -->
    <div class="auth-card register-card">

        <div class="auth-logo">♡</div>

        <h1>Create Account</h1>

        <p>Create your personal nutrition profile.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for c, m in messages %}
                <div class="auth-message {{ c }}">{{ m }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Full Name</label>
            <input
                name="name"
                type="text"
                placeholder="Enter your full name"
                required
            >

            <label>Username</label>
            <input
                name="username"
                type="text"
                placeholder="Choose a username"
                required
            >

            <label>Password</label>
            <input
                name="password"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <div class="auth-two">

                <div>
                    <label>Age</label>
                    <input
                        name="age"
                        type="number"
                        placeholder="Age"
                        required
                    >
                </div>

                <div>
                    <label>Height (cm)</label>
                    <input
                        name="height"
                        type="number"
                        step="0.1"
                        placeholder="Height"
                        required
                    >
                </div>

            </div>

            <div class="auth-two">

                <div>
                    <label>Gender</label>

                    <select name="gender">
                        <option>Female</option>
                        <option>Male</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label>Food Preference</label>

                    <select name="food_preference">
                        <option>Veg</option>
                        <option>Non-Veg</option>
                    </select>
                </div>

            </div>

            <button class="primary-btn auth-btn">
                Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
